<div>
  <form [formGroup]="form" (ngSubmit)="submit()">
    @for (dicounter of ordersFormArray.controls; track dicounter; let i = $index) {
      <label formArrayName="dicounters">
        <input type="checkbox" [formControlName]="i" />
        {{ discounterBox[i].name }}
      </label>
    }
    <div>
      <label for="aktivate">
        Aktiviere -><input id="aktivate" type="checkbox" (change)="buttonActive = !buttonActive" />
      </label>
      <button class="btn" [disabled]="buttonActive">Löschen</button>
    </div>
  </form>
</div>
