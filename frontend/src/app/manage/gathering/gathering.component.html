<div class="gather-form">
  <label *ngFor="let choice of choices" class="choice">
    <input type="checkbox" [(ngModel)]="choice.selected" [disabled]="status?.running">
    {{choice.name}}
  </label>
  <div>
    <label class="choice">
      <input type="checkbox" [(ngModel)]="confirmed" [disabled]="status?.running"> Aktiviere
    </label>
    <button class="btn" type="button" [disabled]="!canStart" (click)="submit()">Sammeln</button>
  </div>

  <p *ngIf="status?.running" class="info">
    Sammeln läuft<span *ngIf="status.current"> – aktuell: <b>{{status.current}}</b></span> …
  </p>
  <p *ngIf="message && !status?.running" class="info">{{message}}</p>
  <p *ngIf="error" class="error">{{error}}</p>
</div>
<hr>

<div>
  <table>
    <tr>
      <th>Datum</th>
      <th>Gültig bis</th>
      <th>Dauer</th>
      <th>Ergebnis</th>
    </tr>
    <tr *ngFor="let report of sortedReports">
      <td>{{report.gatherDate}}</td>
      <td>{{report.expiryDate}}</td>
      <td>{{report.duration / 1000 | number:'1.0-0'}} s</td>
      <td>
        <div *ngFor="let entry of report.discount | keyvalue" [class.error]="isError(entry.value)">
          <b>{{entry.key}}:</b> {{entry.value}}
        </div>
      </td>
    </tr>
  </table>
</div>
