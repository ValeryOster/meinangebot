<div class="auswahl_diskounter">
  <form [formGroup]="form" (ngSubmit)="submit()" class="checkboxForm">
    @for (dicounter of ordersFormArray.controls; track dicounter; let i = $index) {
      <label formArrayName="dicounters" class="discounterLabel">
        <input type="checkbox" [formControlName]="i" />
        {{ discounterBox[i].name }}
      </label>
    }
    <button class="btn">Auswahl</button>
  </form>
</div>

<div>
  <app-offers></app-offers>
</div>

<a href="#" id="scroll-to-top" class="back-to-top" style="display: inline">
  <fa-icon [icon]="arrowUp"></fa-icon>
</a>
