# Lokales HTTPS – zusammen mit "dev" aktivieren: --spring.profiles.active=dev,https
#   https://localhost      (Port 443)
#   http://localhost  ->   Umleitung auf HTTPS (Port 80)
# Zertifikat erzeugen: siehe docs/LOKALER_START.md, Abschnitt "HTTPS lokal"
server.port=${HTTPS_PORT:443}
server.ssl.enabled=true
server.ssl.key-store=${SSL_KEY_STORE:file:certs/localhost.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:changeit}
server.http-redirect.enabled=${HTTP_REDIRECT_ENABLED:true}
server.http-redirect.port=${HTTP_PORT:80}
