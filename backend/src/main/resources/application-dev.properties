# Activate with SPRING_PROFILES_ACTIVE=dev or --spring.profiles.active=dev
server.ssl.enabled=${SSL_ENABLED:false}
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/angebot?createDatabaseIfNotExist=true&sessionVariables=sql_mode='NO_ENGINE_SUBSTITUTION'&jdbcCompliantTruncation=false&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:true}
app.bootstrap.admin.password=${APP_ADMIN_PASSWORD:admin123456}

selenium.chrome.arguments=${SELENIUM_CHROME_ARGUMENTS:--remote-allow-origins=*}
