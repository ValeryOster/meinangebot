spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/angebot}
spring.datasource.username=${DB_USERNAME:angebot}
spring.datasource.password=${DB_PASSWORD:angebot}
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.ssl.enabled=true
server.port=443
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=pkcs12
# Passwort des Keystores – nur per Umgebungsvariable, nie im Repository
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}

# App Security Properties
# Base64-Schlüssel (mind. 64 Byte) zum Signieren der JWTs – nur per Umgebungsvariable,
# z. B. erzeugen mit: openssl rand -base64 64 | tr -d "\n"
app.jwtSecret=${APP_JWT_SECRET}
app.jwtExpirationMs=${APP_JWT_EXPIRATION_MS:86400000}

#2-Montag,3-Dienstag,5-Donnerstag,6-Freitag
map.of.penny.days={\
2:{'angebotszeitraum-ab-montag', 'angebotszeitraum-ab-montag-lebensmittel','ab-montag'},\
3:{'angebotszeitraum-ab-dienstag-non-food'},\
4:{'ab-mittwoch'},\
5:{'angebotszeitraum-ab-donnerstag','ab-donnerstag'},\
6:{'angebotszeitraum-ab-freitag'}\
}
# Netto: Filiale, deren Angebote gesammelt werden (Cookie netto_user_stores_id)
netto.mainUrl=https://www.netto-online.de/filialangebote
netto.storeId=${NETTO_STORE_ID:9103}

penny.mainUrl=https://www.penny.de
penny.categories=top-angebote,obst-und-gemuese,kuehlregal,butchers,angrillen-und-absparen,suessigkeiten-und-snacks,fleisch-und-wurst,weitere-angebote,drogerie-und-haushalt,getraenke,pflanzen-mo-sa,dauerhaft-im-preis-gesenkt,haushalt-und-wohnen,kochen-und-backen,pflanzen,sport-und-freizeit,garten-und-baumarkt,multimedia-und-elektronik,fussballparty,food-highlights-fuer-alle,obst-und-gemuese1,gemeinsam-jubeln-gemeinsam-sparen,xxl-lebensmittel-fuer-alle,sparen-auf-top-marken,drogerie-und-haushalt1,getraenke1,framstag

#Definiere Ablagerungsort fur Bilder
main.bilder=${user.dir}/images
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,\
  classpath:/public/,file:///${main.bilder}

